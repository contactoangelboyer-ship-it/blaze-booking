kind = "web"
previewPath = "/"
title = "Blaze Car Service — Booking"
version = "1.0.0"
id = "artifacts/blaze-booking"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21350

[services.development]
run = "pnpm --filter @workspace/blaze-booking run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blaze-booking", "run", "build" ]
publicDir = "artifacts/blaze-booking/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21350"
BASE_PATH = "/"
