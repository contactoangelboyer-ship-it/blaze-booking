  <body>
    <div id="root"></div>

    <script>
      (function () {
        const sel = [
          '#replit-badge-container',
          '#replit-badge',
          '[data-replit-badge]',
          'iframe[src*="replit.com/badge"]',
          'a[href*="replit.com/badge"]',
        ].join(',');
        const remove = () => { document.querySelectorAll(sel).forEach(el => el.remove()); };
        remove();
        new MutationObserver(remove).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
